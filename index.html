<style>
/* VOICE: friendly kampung game for ages 13–50, short plain Malay
   IDEA: a wooden signboard hanging over a sunny padi-green world
   PICTURE: the 3D world itself, full screen
   COLOUR and TYPE: deep leaf green panels, cream text, padi-yellow accent; Baloo 2
   LAYOUT: status top-left, menu top-right, action buttons bottom-right, d-pad only in vehicles */
:root{color-scheme:light dark;--panel:rgba(28,52,36,.9);--ink:#fff7e3;--acc:#ffd23f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8f0;font:16px/1.4 "Baloo 2",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0}#game canvas{display:block}
.panel{background:var(--panel);border:2px solid rgba(255,210,63,.35);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#hud{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;max-width:min(390px,calc(100vw - 80px))}
#stat{padding:5px 12px;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 12px}

.ph{width:210px;margin:8px auto;border:4px solid #cfd8dc;border-radius:24px;background:#fafafa;color:#222;overflow:hidden;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ph .pbar{background:#eceff1;padding:8px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden}.ph .pbar.top{font-size:12px}
.ph .pbody{height:90px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;background:#a5d6a7}
.ph .plist div{padding:8px 12px;border-bottom:1px solid #e0e0e0}
.ph .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;font-size:26px;text-align:center;background:linear-gradient(#6a8caf,#9fb8d0)}
.ph .hl{outline:3px solid #ff9800;outline-offset:2px;border-radius:8px;background:#fff3c4;animation:igp 1s infinite alternate;display:inline-block}
.ph .plist .hl,.ph .pgrid .hl{display:block}
@keyframes igp{from{box-shadow:0 0 0 0 rgba(255,152,0,.7)}to{box-shadow:0 0 0 8px rgba(255,152,0,0)}}
.igc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--ink)}
.igc.me{border-color:#ffd23f;background:rgba(255,210,63,.15)}.igc small{opacity:.8}
.igdots{display:flex;gap:5px;justify-content:center}.igdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)}.igdots i.on{background:#ffd23f;width:20px}
#stat b{color:var(--acc)}#stat .full{color:#ff8a80}
body.driving #task{padding:3px 10px;max-width:230px;opacity:.82}body.driving #task .lbl,body.driving #task small{display:none}body.driving #task b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.driving #task b::before{content:'🎯 '}
body.driving #cap{font-size:13px;max-width:300px;padding:5px 10px;opacity:.9}body.driving #cap .ch{display:none}body.driving #stat{font-size:14px}
#task{padding:6px 12px 7px;font-size:15px;cursor:pointer;border-color:rgba(255,210,63,.75)}
#task .lbl{font-size:11.5px;letter-spacing:.6px;color:var(--acc);font-weight:700;display:flex;justify-content:space-between;gap:8px}#task .lbl i{font-style:normal;opacity:.8;letter-spacing:0;font-weight:500}
#task b{display:block;font-size:16.5px;line-height:1.2}#task small{display:block;opacity:.92;font-size:13.5px;line-height:1.3;margin-top:2px}#task.tut{border-color:#ffd23f;box-shadow:0 0 0 2px rgba(255,210,63,.35)}
#navB{padding:4px 6px 4px 12px;font-weight:700;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%}#navA{display:inline-block;font-size:22px;color:var(--acc);transition:transform .15s}#navB button{min-height:34px;min-width:34px;padding:0 8px}#task span{color:var(--acc);font-weight:700}
#stat .gok{color:#7dffb0;background:rgba(61,220,132,.15);border-radius:8px;padding:0 6px}#stat .gok b{color:#7dffb0}#stat .gno{color:#ffb3a8;background:rgba(255,61,61,.18);border-radius:8px;padding:0 6px;cursor:pointer;animation:igp 1.2s infinite alternate}
#bCloud{position:relative}#bCloud .dot{position:absolute;top:3px;right:3px;width:11px;height:11px;border-radius:6px;background:#ff3d3d;box-shadow:0 0 0 2px #1b2b20;animation:igp 1s infinite alternate}#bCloud.ok .dot{background:#3ddc84;animation:none}
#menu{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid rgba(255,210,63,.45);border-radius:12px;min-height:44px;min-width:44px;padding:4px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:active,button.down{transform:scale(.94);filter:brightness(1.25)}
button.pri{background:#e0a91c;color:#2b1d05;border-color:#ffe08a;font-weight:700}
button.ok{background:#3f8f52;border-color:#9be3a9}
button:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;top:44%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5;width:max-content;max-width:90vw}
#toast div{padding:5px 14px;animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}
#dpad{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:4px}
#dpad button{font-size:24px;padding:0;border-radius:16px;background:rgba(28,52,36,.8);touch-action:none}
#dpad [data-d=f]{grid-area:1/2}#dpad [data-d=l]{grid-area:2/1}#dpad [data-d=r]{grid-area:2/3}#dpad [data-d=b]{grid-area:3/2}
#acts{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;grid-template-areas:"x guna" "run guna" "veh veh";gap:8px;align-items:end;justify-items:end}
#bUse{grid-area:guna;width:108px;height:108px;border-radius:50%;font-weight:700;font-size:15px;line-height:1.1;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bUse .ic{font-size:30px}
#bRun{grid-area:run;width:76px;height:56px;font-weight:700}#bRun.on{background:#e0a91c;color:#2b1d05}
#bClean{grid-area:x;width:76px;height:56px;font-weight:700}
#bVeh{grid-area:veh;height:50px;font-weight:700;min-width:190px}
#left{position:fixed;left:10px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100vw - 150px);pointer-events:none;z-index:4}
#left.veh{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 210px)}
#cap{padding:8px 12px;font-size:14.5px;line-height:1.35;max-width:430px;pointer-events:auto;background:rgba(16,44,74,.93);border-color:rgba(125,190,255,.6)}#cap b{color:#9fd3ff}
#cap .ch{font-size:11.5px;letter-spacing:.6px;color:#9fd3ff;font-weight:700;margin-bottom:2px}
#cap .pb{height:7px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden;width:180px;max-width:100%}#cap .pb i{display:block;height:100%;width:0;background:var(--acc)}
#tray{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
#left.wide{max-width:calc(100vw - 20px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 128px);z-index:6}
#tray.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 290px);min-height:min(420px,calc(100vh - 290px));overflow:auto;padding:8px;border-radius:14px;background:rgba(28,52,36,.94);border:2px solid rgba(255,210,63,.35)}
#left.wide #cap{display:none!important}
#left.build{max-width:calc(100vw - 20px)}#tray.bar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-height:58px;flex-shrink:0;align-items:center;max-width:calc(100vw - 20px);padding:6px;border-radius:14px;background:rgba(28,52,36,.9);touch-action:pan-x;-webkit-overflow-scrolling:touch}#tray.bar button{flex:none;white-space:nowrap}
#tray.grid .hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:18px}
@media(min-width:600px){#tray.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;align-items:start}
@media (max-width:560px){#tray.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#tray .sc{font-size:13.5px;padding:8px 9px}#tray .sc .t{font-size:16px}#tray .sc .r{white-space:normal;flex-wrap:wrap}}
#tray .sc>*{position:static;min-width:0;overflow-wrap:anywhere}}
#tray.grid .hd button{min-height:38px}
#tray .sc{cursor:pointer;border:2px solid rgba(255,210,63,.45);border-radius:12px;color:var(--ink);display:flex;height:auto;flex-direction:column;align-items:stretch;text-align:left;padding:10px 12px;gap:4px;line-height:1.25;font-weight:500;font-size:15px;min-height:0;background:rgba(255,255,255,.06)}
#tray .sc .t{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:28px}
#tray .sc .own{font-size:13.5px;opacity:.85;min-height:18px}
#tray .sc .r{display:flex;justify-content:space-between;white-space:nowrap;gap:4px}#tray .sc .r b{font-weight:700}
#tray .sc .g{color:#9be3a9;font-weight:700}
#tray.grid .hd small{display:block;font-weight:500;font-size:14px;opacity:.85}
#tray .sc .buy{margin-top:6px;text-align:center;border-radius:10px;background:#e0a91c;color:#2b1d05;font-weight:700;padding:8px 0;font-size:16px}
#tray .sc.lock{opacity:.55}
#tray .sc .buys{display:flex;gap:5px;margin-top:6px}#tray .sc .buys .buy{flex:1;margin-top:0;padding:9px 0}
/* iOS Safari: elak kad bertindih — guna flex-wrap, bukan grid, & jangan kecutkan anak */
#tray.grid{display:flex!important;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;flex-shrink:0;-webkit-overflow-scrolling:touch}
#tray.grid>*{flex:0 0 calc(50% - 4px);max-width:calc(50% - 4px);box-sizing:border-box}
#tray.grid>.hd{flex-basis:100%;max-width:100%}
@media (min-width:561px){#tray.grid>.sc{flex-basis:calc(33.33% - 6px);max-width:calc(33.33% - 6px)}}
#tray .sc,#tray .sc>*,#tray .sc .r,#tray .sc .buys{flex-shrink:0}
#tray .sc{height:auto!important;overflow:visible}#tray .sc.lock .buy{background:rgba(255,255,255,.15);color:var(--ink)}
#tray button{min-height:42px;font-size:14.5px;padding:4px 10px;font-weight:700;background:rgba(28,52,36,.92)}#tray button.pri{background:#e0a91c}
.hide{display:none!important}
#banner{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 76px);width:min(520px,calc(100vw - 80px));padding:8px 12px;z-index:6;text-align:center}
body.bnr #task,body.bnr #navB,body.pnl #task{display:none}
#banner h3{margin:0;color:var(--acc);font-size:20px;line-height:1.15}#banner p{margin:4px 0 8px;font-size:15px}
#banner .r{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}

#box{width:min(540px,100%);max-height:88vh;overflow:auto;padding:16px 16px;touch-action:pan-y}
#box h2{margin:0 0 6px;font-size:25px;line-height:1.1;color:var(--acc)}
#box h3{margin:14px 0 4px;font-size:18px}
#box p{margin:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,247,227,.15)}
.row .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.price{white-space:nowrap;color:var(--acc);font-weight:700}
.note{font-size:13.5px;opacity:.9;margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.opts button{text-align:left;line-height:1.2;padding:8px 10px}
.close{float:right;margin:-4px -6px 0 8px}
.tabs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#7bd389}
.card{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);margin:6px 0}
.card h4{margin:0 0 2px;font-size:17px}.card small{opacity:.85}
.said{background:rgba(123,211,137,.16);border:1px solid rgba(123,211,137,.5)}
.steps{display:flex;gap:6px;margin:6px 0}.steps i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}.steps i.d{background:var(--acc)}

.reel{display:flex;gap:14px;justify-content:center;align-items:stretch;margin:10px 0}

.bigbtn{width:100%;min-height:60px;font-size:19px;font-weight:700}

.bite{animation:shake .15s infinite}@keyframes shake{50%{transform:translateX(4px)}}
</style>

 else if(F.st==='reel'){F.zv-=1.5*dt;F.zv*=.985;F.zy+=F.zv*dt;if(F.zy<0){F.zy=0;F.zv=0}if(F.zy>1-F.zh){F.zy=1-F.zh;F.zv=0}
